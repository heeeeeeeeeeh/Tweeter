<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tweeter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link href="css/index.css" rel="stylesheet" />
  </head>
  <body class="vh-100 vw-100">
    <nav class="navbar navbar-light bg-light">
      <div class="container h-100 w-100 justify-content-center">
        <a
          class="navbar-brand gap-3 h-100 w-100 d-flex justify-content-center align-items-center"
          href="#"
        >
          <img
            class="h-75 w-auto d-inline-block"
            src="images/twitter.svg"
            alt="twitter logo"
          />
          <span class="header-name display-5 fw-bold">Tweeter</span>
        </a>
      </div>
    </nav>
    <main class="w-100 d-flex flex-column align-items-center py-4">
      <div
        id="tweets"
        class="h-100 bg-light rounded container gap-3 d-flex flex-column pt-3"
      >
        <div
          id="draftTweet"
          class="container d-flex flex-column h-25 w-100 gap-3"
        >
          <div
            id="draftTweetTop"
            class="d-flex gap-3 h-50 w-100 justify-content-center"
          >
            <img
              src="images/circle-user.svg"
              alt="user profile"
              class="h-100 w-auto align-top"
            />
            <textarea
              id="tweetInput"
              class="border-0 w-100"
              placeholder="What's happening?"
            ></textarea>
          </div>
          <div
            id="draftTweetBottom"
            class="d-flex h-25 w-100 justify-content-end align-items-center gap-3"
          >
            <p
              id="charRemaining"
              class="charRemaining m-0 text-center align-top"
            >
              <span id="charRemainingNum">160</span> char remaining
            </p>
            <button id="draftTweetButton" class="">Tweet</button>
          </div>
        </div>
        <div class="tweet container d-flex flex-column h-25 w-100 gap-3">
          <div class="tweetTop d-flex gap-3 h-50 w-100">
            <img
              src="images/circle-user.svg"
              alt="user profile"
              class="h-100 w-auto align-top"
            />
            <div class="d-flex flex-column gap-2">
              <p class="tweetUser m-0">
                <span class="tweetUserName">Silvestre Espinoza</span>
                <span class="tweetUserId">@silvestre.utrgv - 5hr</span>
              </p>
              <p class="tweetContent m-0">Hey, CSCI 3342 is cool!</p>
            </div>
          </div>
          <div
            class="tweetBottom d-flex h-25 w-100 justify-content-around align-items-center gap-3"
          >
            <div class="stat d-flex gap-1">
              <img
                src="images/comment.svg"
                alt="comment icon"
                class="statIcon"
              />
              <span class="statCounter">1</span>
            </div>
            <div class="stat d-flex gap-1">
              <img
                src="images/retweet.svg"
                alt="retweet icon"
                class="statIcon"
              />
              <span class="statCounter">1</span>
            </div>
            <div class="stat d-flex gap-1">
              <img src="images/like.svg" alt="like icon" class="statIcon" />
              <span class="statCounter">1</span>
            </div>
            <div class="stat d-flex gap-1">
              <img src="images/share.svg" alt="share icon" class="statIcon" />
              <span class="statCounter">1</span>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="js/index.js"></script>
  </body>
</html>
